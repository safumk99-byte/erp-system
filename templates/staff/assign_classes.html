{% extends "layouts/dashboard.html" %}

{% block title %}
Assign Classes
{% endblock %}

{% block page_content %}

<div class="max-w-4xl mx-auto">

    <div class="mb-8">

        <a href="{{ url_for('staff.staff_list') }}"
           class="text-sm text-slate-500 hover:text-slate-800">
            ← Back to Staff
        </a>

        <h1 class="text-3xl font-bold text-slate-800 mt-4">
            Assign Classes
        </h1>

        <p class="text-slate-500 mt-2">
            Assign classes to {{ staff.full_name }}
        </p>

    </div>


    <form method="POST">

        <div class="bg-white border border-slate-200 rounded-2xl p-6">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                {% for class in classes %}

                <label
                    class="flex items-center gap-3 border border-slate-200 rounded-xl p-4 cursor-pointer hover:bg-slate-50">

                    <input
                        type="checkbox"
                        name="class_ids"
                        value="{{ class.id }}"
                        {% if class.id in assigned_class_ids %}
                            checked
                        {% endif %}
                        class="w-5 h-5 rounded">

                    <div>

                        <p class="font-semibold text-slate-800">
                            {{ class.class_name }}
                        </p>

                    </div>

                </label>

                {% else %}

                <p class="text-slate-500">
                    No active classes found.
                </p>

                {% endfor %}

            </div>


            <div class="flex justify-end mt-6">

                <button
                    type="submit"
                    class="px-6 py-3 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition">

                    Save Class Assignments

                </button>

            </div>

        </div>

    </form>

</div>

{% endblock %}
