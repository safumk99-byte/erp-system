{% extends "layouts/dashboard.html" %}

{% block title %}
Edit Staff
{% endblock %}

{% block page_content %}

<div class="max-w-3xl mx-auto">

    <div class="mb-8">

        <h1 class="text-3xl font-bold text-slate-800">
            Edit Staff
        </h1>

        <p class="text-slate-500 mt-2">
            Update staff information.
        </p>

    </div>

    {% include "components/alert.html" %}

    <form method="POST"
          class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6">

        <div>

            <label class="block mb-2 font-medium">
                Full Name
            </label>

            <input
                type="text"
                name="full_name"
                value="{{ staff.full_name }}"
                required
                class="w-full border rounded-xl px-4 py-3">

        </div>

        <div>

            <label class="block mb-2 font-medium">
                Username
            </label>

            <input
                type="text"
                name="username"
                value="{{ staff.username }}"
                required
                class="w-full border rounded-xl px-4 py-3">

        </div>

        <div>

            <label class="block mb-2 font-medium">
                Email
            </label>

            <input
                type="email"
                name="email"
                value="{{ staff.email or '' }}"
                class="w-full border rounded-xl px-4 py-3">

        </div>

        <div>

            <label class="block mb-2 font-medium">
                Phone
            </label>

            <input
                type="text"
                name="phone"
                value="{{ staff.phone or '' }}"
                class="w-full border rounded-xl px-4 py-3">

        </div>

        <div>

            <label class="block mb-2 font-medium">
                Role
            </label>

            <select
                name="role"
                required
                class="w-full border rounded-xl px-4 py-3">

                <option value="staff"
                    {% if staff.role_name == "staff" %}selected{% endif %}>
                    Staff
                </option>

                <option value="principal"
                    {% if staff.role_name == "principal" %}selected{% endif %}>
                    Principal
                </option>

            </select>

        </div>

        <div class="flex justify-end gap-3">

            <a href="{{ url_for('staff.staff_list') }}"
               class="px-6 py-3 rounded-xl border">

                Cancel

            </a>

            <button
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl">

                Update Staff

            </button>

        </div>

    </form>

</div>

{% endblock %}
