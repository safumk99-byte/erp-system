{% extends "layouts/dashboard.html" %}

{% block title %}
Add Publication
{% endblock %}

{% block page_content %}

<div class="max-w-4xl mx-auto">

    <div class="mb-8">

        <h1 class="text-3xl font-bold text-slate-800">
            Add Publication
        </h1>

        <p class="text-slate-500 mt-2">
            Record a student's published article or book
        </p>

    </div>


    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

        <form method="POST">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Student -->

                <div class="md:col-span-2">

                    <label class="block mb-2 font-medium">
                        Student
                    </label>

                    <select
                        name="student_id"
                        required
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                        <option value="">
                            Select Student
                        </option>

                        {% for student in students %}

                        <option value="{{ student.id }}">

                            {{ student.admission_no }}
                            -
                            {{ student.full_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Publication Type -->

                <div>

                    <label class="block mb-2 font-medium">
                        Publication Type
                    </label>

                    <select
                        name="publication_type"
                        required
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                        <option value="Article">
                            Article
                        </option>

                        <option value="Book">
                            Book
                        </option>

                    </select>

                </div>


                <!-- Category -->

                <div>

                    <label class="block mb-2 font-medium">
                        Category
                    </label>

                    <select
                        name="category"
                        required
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                        <option value="Fiction">
                            Fiction
                        </option>

                        <option value="Non-Fiction">
                            Non-Fiction
                        </option>

                    </select>

                </div>


                <!-- Title -->

                <div class="md:col-span-2">

                    <label class="block mb-2 font-medium">
                        Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        required
                        placeholder="Enter publication title"
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                </div>


                <!-- Pages -->

                <div>

                    <label class="block mb-2 font-medium">
                        Pages
                    </label>

                    <input
                        type="number"
                        name="pages"
                        min="1"
                        placeholder="Number of pages"
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                </div>


                <!-- Publication Date -->

                <div>

                    <label class="block mb-2 font-medium">
                        Publication Date
                    </label>

                    <input
                        type="date"
                        name="publication_date"
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                </div>


                <!-- ISBN -->

                <div>

                    <label class="block mb-2 font-medium">
                        ISBN
                    </label>

                    <input
                        type="text"
                        name="isbn"
                        placeholder="Enter ISBN if available"
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                </div>


                <!-- Verification Value -->

                <div>

                    <label class="block mb-2 font-medium">
                        Verification Value
                    </label>

                    <input
                        type="text"
                        name="verification_value"
                        placeholder="ISBN / other verification reference"
                        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                </div>

            </div>


            <!-- Description -->

            <div class="mt-6">

                <label class="block mb-2 font-medium">
                    Description
                </label>

                <textarea
                    name="description"
                    rows="6"
                    placeholder="Enter publication details..."
                    class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>

            </div>


            <!-- Buttons -->

            <div class="flex justify-end gap-4 mt-8">

                <a
                    href="{{ url_for('publication.publication_list') }}"
                    class="px-6 py-3 rounded-xl border border-slate-300 hover:bg-slate-50">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl">

                    Submit Publication

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
