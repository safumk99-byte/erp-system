{% extends "layouts/dashboard.html" %}

{% block title %}Add Student{% endblock %}

{% block page_content %}

<div class="max-w-4xl mx-auto">

    <div class="mb-8">

        <h1 class="text-3xl font-bold text-slate-800">
            Add Student
        </h1>

        <p class="text-slate-500 mt-2">
            Create a new student.
        </p>

    </div>

    {% include "components/alert.html" %}

    <form method="POST"
          class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div>

                <label class="block mb-2 font-medium">
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    required
                    class="w-full border rounded-xl px-4 py-3">

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Gender
                </label>

                <select
                    name="gender"
                    required
                    class="w-full border rounded-xl px-4 py-3">

                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>

                </select>

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Date of Birth
                </label>

                <input
                    type="date"
                    name="date_of_birth"
                    required
                    class="w-full border rounded-xl px-4 py-3">

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Class
                </label>

                <select
                    name="class_id"
                    required
                    class="w-full border rounded-xl px-4 py-3">

                    <option value="">
                        Select Class
                    </option>

                    {% for class_item in classes %}

                    <option value="{{ class_item.id }}">
                        {{ class_item.class_name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Parent Name
                </label>

                <input
                    type="text"
                    name="parent_name"
                    required
                    class="w-full border rounded-xl px-4 py-3">

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Parent Phone
                </label>

                <input
                    type="text"
                    name="parent_phone"
                    required
                    class="w-full border rounded-xl px-4 py-3">

            </div>

        </div>

        <div class="mt-6">

            <label class="block mb-2 font-medium">
                Address
            </label>

            <textarea
                name="address"
                rows="4"
                class="w-full border rounded-xl px-4 py-3"></textarea>

        </div>

        <div>

    <label class="block mb-2 font-medium text-slate-700">
        Student Login Password
    </label>

    <input
        type="password"
        name="student_password"
        required
        minlength="6"
        placeholder="Enter student login password"
        class="w-full border border-slate-300 rounded-xl px-4 py-3">

    <p class="text-sm text-slate-500 mt-2">
        This password will be used by the student to log in.
    </p>

</div>

        <div class="mt-8 flex justify-end gap-3">

            <a href="{{ url_for('students.student_list') }}"
               class="px-6 py-3 rounded-xl border">

                Cancel

            </a>

            <button
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl">

                Save Student

            </button>

        </div>

    </form>

</div>

{% endblock %}
