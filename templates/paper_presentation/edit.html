{% extends "layouts/dashboard.html" %}

{% block title %}
Edit Paper Presentation
{% endblock %}

{% block page_content %}

<div class="max-w-4xl mx-auto">

    <div class="mb-8">

        <h1 class="text-3xl font-bold text-slate-800">
            Edit Paper Presentation
        </h1>

        <p class="text-slate-500 mt-2">
            Update pending paper presentation
        </p>

    </div>


    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

        <form
            method="POST"
            enctype="multipart/form-data">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Student -->

                <div class="md:col-span-2">

                    <label class="block mb-2 font-medium">
                        Student
                    </label>

                    <select
                        name="student_id"
                        required
                        class="w-full border rounded-xl px-4 py-3">

                        {% for student in students %}

                        <option
                            value="{{ student.id }}"
                            {% if student.id == presentation.student_id %}
                                selected
                            {% endif %}>

                            {{ student.admission_no }} -
                            {{ student.full_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Topic -->

                <div class="md:col-span-2">

                    <label class="block mb-2 font-medium">
                        Topic
                    </label>

                    <input
                        type="text"
                        name="topic"
                        required
                        value="{{ presentation.topic }}"
                        class="w-full border rounded-xl px-4 py-3">

                </div>


                <!-- Level -->

                <div>

                    <label class="block mb-2 font-medium">
                        Presentation Level
                    </label>

                    <select
                        name="presentation_level"
                        id="presentationLevel"
                        required
                        class="w-full border rounded-xl px-4 py-3">

                        <option
                            value="State"
                            {% if presentation.presentation_level == "State" %}
                                selected
                            {% endif %}>
                            State Level — 8 Points
                        </option>

                        <option
                            value="National"
                            {% if presentation.presentation_level == "National" %}
                                selected
                            {% endif %}>
                            National Level — 10 Points
                        </option>

                        <option
                            value="International"
                            {% if presentation.presentation_level == "International" %}
                                selected
                            {% endif %}>
                            International Level — 20 Points
                        </option>

                        <option
                            value="Others"
                            {% if presentation.presentation_level == "Others" %}
                                selected
                            {% endif %}>
                            Others — 5 Points
                        </option>

                    </select>

                </div>


                <!-- Affiliation -->

                <div>

                    <label class="block mb-2 font-medium">
                        Affiliated University / College
                    </label>

                    <input
                        type="text"
                        name="affiliated_institution"
                        id="affiliatedInstitution"
                        value="{{ presentation.affiliated_institution or '' }}"
                        placeholder="Required for Others"
                        class="w-full border rounded-xl px-4 py-3">

                </div>


                <!-- Verification -->

                <div>

                    <label class="block mb-2 font-medium">
                        Verification Value
                    </label>

                    <input
                        type="text"
                        name="verification_value"
                        value="{{ presentation.verification_value or '' }}"
                        class="w-full border rounded-xl px-4 py-3">

                </div>


                <!-- Certificate -->

                <div>

                    <label class="block mb-2 font-medium">
                        Replace Certificate
                    </label>

                    <input
                        type="file"
                        name="certificate_file"
                        accept=".pdf,.jpg,.jpeg,.png"
                        class="w-full border rounded-xl px-4 py-3">

                    {% if presentation.certificate_file %}

                    <p class="text-xs text-green-600 mt-2">
                        Existing certificate uploaded
                    </p>

                    {% endif %}

                </div>

            </div>


            <!-- Description -->

            <div class="mt-6">

                <label class="block mb-2 font-medium">
                    Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                    class="w-full border rounded-xl px-4 py-3">{{ presentation.description or '' }}</textarea>

            </div>


            <div class="flex justify-end gap-4 mt-8">

                <a
                    href="{{ url_for('paper_presentation.paper_presentation_list') }}"
                    class="px-6 py-3 rounded-xl border">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl">

                    Update

                </button>

            </div>

        </form>

    </div>

</div>


<script>

const level =
    document.getElementById(
        "presentationLevel"
    );

const affiliation =
    document.getElementById(
        "affiliatedInstitution"
    );


function updateAffiliation() {

    if (level.value === "Others") {

        affiliation.required = true;

    } else {

        affiliation.required = false;

    }

}


level.addEventListener(
    "change",
    updateAffiliation
);

updateAffiliation();

</script>

{% endblock %}
