{% extends "layouts/dashboard.html" %}

{% block title %}
Edit Subject
{% endblock %}

{% block page_content %}

<div class="max-w-3xl mx-auto">

    <div class="mb-8">

        <h1 class="text-3xl font-bold text-slate-800">
            Edit Subject
        </h1>

        <p class="text-slate-500 mt-2">
            Update subject information.
        </p>

    </div>

    {% include "components/alert.html" %}

    <form method="POST"
          class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6">

        <div>

            <label class="block mb-2 font-medium">
                Class
            </label>

            <select
                name="class_id"
                required
                class="w-full border rounded-xl px-4 py-3">

                {% for class_item in classes %}

                <option
                    value="{{ class_item.id }}"
                    {% if class_item.id == subject.class_id %}selected{% endif %}>

                    {{ class_item.class_name }}

                </option>

                {% endfor %}

            </select>

        </div>

        <div>

            <label class="block mb-2 font-medium">
                Subject Name
            </label>

            <input
                type="text"
                name="subject_name"
                value="{{ subject.subject_name }}"
                required
                class="w-full border rounded-xl px-4 py-3">

        </div>

        <div>

            <label class="block mb-2 font-medium">
                Description
            </label>

            <textarea
                name="description"
                rows="4"
                class="w-full border rounded-xl px-4 py-3">{{ subject.description or "" }}</textarea>

        </div>

        <div class="flex justify-end gap-3">

            <a href="{{ url_for('subjects.subject_list') }}"
               class="px-6 py-3 rounded-xl border">

                Cancel

            </a>

            <button
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl">

                Update Subject

            </button>

        </div>

    </form>

</div>

{% endblock %}
