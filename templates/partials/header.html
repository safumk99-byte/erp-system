<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6">

    <!-- Left -->
    <div>

        <h1 class="text-xl font-semibold text-slate-800">
            Dashboard
        </h1>

        <p class="text-sm text-slate-500">
            Welcome back, {{ session.get("full_name") }}
        </p>

    </div>

    <!-- Right -->
    <div class="flex items-center gap-5">

        <!-- Search -->
        <div class="relative">

            <i data-lucide="search"
               class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>

            <input
                type="text"
                placeholder="Search..."
                class="pl-10 pr-4 py-2 w-64 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">

        </div>

        <!-- Notification -->
        <button class="relative p-2 rounded-lg hover:bg-slate-100">

            <i data-lucide="bell" class="w-5 h-5"></i>

            <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-red-500"></span>

        </button>

        <!-- User -->
        <div class="flex items-center gap-3">

            <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-semibold">

                {{ session.get("full_name","A")[0] }}

            </div>

            <div>

                <p class="font-medium text-sm">

                    {{ session.get("full_name") }}

                </p>

                <p class="text-xs text-slate-500">

                    {{ session.get("role")|replace("_"," ")|title }}

                </p>

            </div>

        </div>

    </div>

</header>
