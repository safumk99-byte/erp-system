<header
    class="
        h-16
        min-h-[4rem]
        bg-white
        border-b
        border-slate-200
        flex
        items-center
        justify-between
        px-4
        sm:px-6
        gap-3
        relative
        z-30
    "
>

    <!-- =====================================================
         LEFT SECTION
    ====================================================== -->

    <div class="flex items-center gap-3 min-w-0">

        <!-- Mobile Menu Button -->

        <button
            type="button"
            id="mobile-sidebar-open"
            aria-label="Open navigation"
            class="
                md:hidden
                w-10
                h-10
                shrink-0
                rounded-xl
                bg-slate-900
                text-white
                flex
                items-center
                justify-center
                hover:bg-slate-800
                transition
            "
        >

            <i
                data-lucide="menu"
                class="w-6 h-6"
            ></i>

        </button>


        <!-- Page Title -->

        <div class="min-w-0">

            <h1
                class="
                    text-lg
                    sm:text-xl
                    font-semibold
                    text-slate-800
                    truncate
                "
            >
                Dashboard
            </h1>

            <p
                class="
                    text-xs
                    sm:text-sm
                    text-slate-500
                    truncate
                    max-w-[180px]
                    sm:max-w-none
                "
            >
                Welcome back, {{ session.get("full_name") }}
            </p>

        </div>

    </div>


    <!-- =====================================================
         RIGHT SECTION
    ====================================================== -->

    <div class="flex items-center gap-2 sm:gap-5">


        <!-- =================================================
             Search
        ================================================== -->

        <div class="relative hidden sm:block">

            <i
                data-lucide="search"
                class="
                    absolute
                    left-3
                    top-1/2
                    -translate-y-1/2
                    w-4
                    h-4
                    text-slate-400
                "
            ></i>

            <input
                type="text"
                placeholder="Search..."
                class="
                    pl-10
                    pr-4
                    py-2
                    w-48
                    md:w-64
                    rounded-lg
                    border
                    border-slate-300
                    focus:outline-none
                    focus:ring-2
                    focus:ring-indigo-500
                "
            >

        </div>


        <!-- =================================================
             Notification
        ================================================== -->

        <form
            method="POST"
            action="{{ url_for('notifications.open_notifications') }}"
            class="relative"
        >

            <button
                type="submit"
                class="
                    relative
                    p-2
                    rounded-lg
                    hover:bg-slate-100
                    transition
                "
                title="Notifications"
            >

                <i
                    data-lucide="bell"
                    class="w-5 h-5"
                ></i>


                {% if unread_notification_count > 0 %}

                <span
                    class="
                        absolute
                        -top-1
                        -right-1
                        min-w-[18px]
                        h-[18px]
                        px-1
                        rounded-full
                        bg-red-500
                        text-white
                        text-[10px]
                        font-bold
                        flex
                        items-center
                        justify-center
                    "
                >

                    {% if unread_notification_count > 99 %}

                        99+

                    {% else %}

                        {{ unread_notification_count }}

                    {% endif %}

                </span>

                {% endif %}

            </button>

        </form>


        <!-- =================================================
             User
        ================================================== -->

        <div class="flex items-center gap-3">

            <!-- Avatar -->

            <div
                class="
                    w-9
                    h-9
                    sm:w-10
                    sm:h-10
                    shrink-0
                    rounded-full
                    bg-indigo-600
                    text-white
                    flex
                    items-center
                    justify-center
                    font-semibold
                "
            >

                {{ session.get("full_name", "A")[0] }}

            </div>


            <!-- User Details -->

            <div class="hidden sm:block">

                <p class="font-medium text-sm">

                    {{ session.get("full_name") }}

                </p>

                <p class="text-xs text-slate-500">

                    {{ session.get("role")|replace("_", " ")|title }}

                </p>

            </div>

        </div>

    </div>

</header>
