{% extends "layouts/dashboard.html" %}

{% block title %}
Edit Exam
{% endblock %}

{% block page_content %}

<div class="max-w-5xl mx-auto">

    <div class="mb-8">

        <h1 class="text-3xl font-bold text-slate-800">
            Edit Exam
        </h1>

        <p class="text-slate-500 mt-2">
            Update examination details
        </p>

    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

        <form method="POST">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Exam Name -->

                <div>

                    <label class="block mb-2 font-medium">

                        Exam Name

                    </label>

                    <input
                        type="text"
                        name="exam_name"
                        required
                        value="{{ exam.exam_name }}"
                        class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500">

                </div>

                <!-- Exam Type -->

                <div>

                    <label class="block mb-2 font-medium">

                        Exam Type

                    </label>

                    <select
                        name="exam_type"
                        required
                        class="w-full border rounded-xl px-4 py-3">

                        <option value="Academic"
                            {% if exam.exam_type=="Academic" %}selected{% endif %}>

                            Academic

                        </option>

                        <option value="Kithab"
                            {% if exam.exam_type=="Kithab" %}selected{% endif %}>

                            Kithab

                        </option>

                    </select>

                </div>

                <!-- Class -->

                <div>

                    <label class="block mb-2 font-medium">

                        Class

                    </label>

                    <select
                        id="classSelect"
                        name="class_id"
                        required
                        class="w-full border rounded-xl px-4 py-3">

                        {% for class_item in classes %}

                        <option
                            value="{{ class_item.id }}"
                            {% if exam.class_id==class_item.id %}selected{% endif %}>

                            {{ class_item.class_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Maximum Mark -->

                <div>

                    <label class="block mb-2 font-medium">

                        Maximum Mark

                    </label>

                    <input
                        type="number"
                        name="total_mark"
                        min="1"
                        required
                        value="{{ exam.total_mark }}"
                        class="w-full border rounded-xl px-4 py-3">

                </div>

                <!-- Exam Date -->

                <div>

                    <label class="block mb-2 font-medium">

                        Exam Date

                    </label>

                    <input
                        type="date"
                        name="exam_date"
                        value="{{ exam.exam_date }}"
                        required
                        class="w-full border rounded-xl px-4 py-3">

                </div>

            </div>

            <!-- Subjects -->

            <div class="mt-8">

                <label class="block mb-4 font-semibold text-lg">

                    Select Subjects

                </label>

                <div
                    id="subjectsContainer"
                    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">

                </div>

            </div>

            <!-- Buttons -->

            <div class="flex justify-end gap-4 mt-10">

                <a
                    href="{{ url_for('exams.exam_list') }}"
                    class="px-6 py-3 rounded-xl border">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl">

                    Update Exam

                </button>

            </div>

        </form>

    </div>

</div>

<script>

const selectedSubjects = {{ selected_subjects|tojson }};

const classSelect = document.getElementById("classSelect");

const subjectsContainer = document.getElementById("subjectsContainer");

async function loadSubjects(){

    const classId = classSelect.value;

    subjectsContainer.innerHTML = "";

    const response = await fetch(
        "/exams/class-subjects/" + classId
    );

    const subjects = await response.json();

    subjects.forEach(subject=>{

        const checked =
            selectedSubjects.includes(subject.id)
            ? "checked"
            : "";

        subjectsContainer.innerHTML += `

            <label class="flex items-center gap-3 border rounded-xl p-4 hover:bg-slate-50 cursor-pointer">

                <input
                    type="checkbox"
                    name="subjects"
                    value="${subject.id}"
                    ${checked}
                    class="w-5 h-5">

                <span>${subject.subject_name}</span>

            </label>

        `;

    });

}

classSelect.addEventListener(
    "change",
    loadSubjects
);

loadSubjects();

</script>

{% endblock %}
