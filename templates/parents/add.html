{% extends "layouts/dashboard.html" %}

{% block title %}
Add Parent
{% endblock %}

{% block page_content %}

<div class="max-w-4xl mx-auto">

    <div class="mb-8">

        <h1 class="text-3xl font-bold text-slate-800">
            Add Parent
        </h1>

        <p class="text-slate-500 mt-2">
            Create a new parent account.
        </p>

    </div>

    {% include "components/alert.html" %}

    <form method="POST"
          class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div>

                <label class="block mb-2 font-medium">
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    required
                    class="w-full border rounded-xl px-4 py-3">

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    class="w-full border rounded-xl px-4 py-3">

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="w-full border rounded-xl px-4 py-3">

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    required
                    class="w-full border rounded-xl px-4 py-3">

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full border rounded-xl px-4 py-3">

            </div>

            <div>

                <label class="block mb-2 font-medium">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                    class="w-full border rounded-xl px-4 py-3">

            </div>

        </div>

        <div class="mt-8 flex justify-end gap-3">

            <a href="{{ url_for('parents.parent_list') }}"
               class="px-6 py-3 rounded-xl border">

                Cancel

            </a>

            <button
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl">

                Save Parent

            </button>

        </div>

    </form>

</div>

{% endblock %}
