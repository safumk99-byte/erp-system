<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            ERP System
        {% endblock %}
    </title>


    <!-- =====================================================
         Tailwind CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/output.css') }}"
    >


    <!-- =====================================================
         Google Font
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         Base Page Styles
    ====================================================== -->

    <style>

        /* -------------------------------------------------
           Global reset
        ------------------------------------------------- */

        html,
        body {

            width: 100%;

            min-width: 100%;

            margin: 0;

            padding: 0;

        }


        html {

            min-height: 100%;

        }


        body {

            min-height: 100vh;

            font-family: 'Inter', sans-serif;

            background-color: #f1f5f9;

            color: #1e293b;

            overflow-x: hidden;

        }


        /* -------------------------------------------------
           Prevent unexpected horizontal shifting
        ------------------------------------------------- */

        *,
        *::before,
        *::after {

            box-sizing: border-box;

        }


        /* -------------------------------------------------
           Images
        ------------------------------------------------- */

        img {

            max-width: 100%;

            height: auto;

        }


        /* -------------------------------------------------
           Links
        ------------------------------------------------- */

        a {

            text-decoration: none;

        }


        /* -------------------------------------------------
           Buttons
        ------------------------------------------------- */

        button,
        input,
        select,
        textarea {

            font-family: inherit;

        }

    </style>


    {% block styles %}

    {% endblock %}

</head>


<body class="bg-slate-100 text-slate-800">


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    {% block content %}

    {% endblock %}


    <!-- =====================================================
         Lucide Icons
    ====================================================== -->

    <script src="https://unpkg.com/lucide@latest"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                if (
                    typeof lucide !== "undefined"
                ) {

                    lucide.createIcons();

                }

            }
        );

    </script>


    {% block scripts %}

    {% endblock %}


</body>

</html>
