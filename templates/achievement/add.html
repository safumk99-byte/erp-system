{% extends "layouts/dashboard.html" %}

{% block title %}
Add Achievement
{% endblock %}

{% block page_content %}

<div class="max-w-4xl mx-auto">

    <div class="mb-8">
        <h1 class="text-3xl font-bold text-slate-800">
            Add Achievement
        </h1>

        <p class="text-slate-500 mt-2">
            Record a student's achievement
        </p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

        <form method="POST" enctype="multipart/form-data">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Student -->

                <div class="md:col-span-2">

                    <label class="block mb-2 font-medium">
                        Student
                    </label>

                    <select
                        name="student_id"
                        required
                        class="w-full border rounded-xl px-4 py-3">

                        <option value="">
                            Select Student
                        </option>

                        {% for student in students %}

                        <option value="{{ student.id }}">
                            {{ student.admission_no }} -
                            {{ student.full_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Event -->

                <div class="md:col-span-2">

                    <label class="block mb-2 font-medium">
                        Event / Competition
                    </label>

                    <input
                        type="text"
                        name="event_name"
                        required
                        placeholder="Sahityotsav / Mahrajan / Kalolsav / Arts Fest / Others"
                        class="w-full border rounded-xl px-4 py-3">

                </div>


                <!-- Category -->

                <div>

                    <label class="block mb-2 font-medium">
                        Achievement Category
                    </label>

                    <select
                        name="achievement_type"
                        id="achievementCategory"
                        required
                        class="w-full border rounded-xl px-4 py-3">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Kithab">
                            Kithab
                        </option>

                        <option value="Language">
                            Language
                        </option>

                        <option value="Writing">
                            Writing
                        </option>

                        <option value="Presentation">
                            Presentation
                        </option>

                        <option value="Others">
                            Others
                        </option>

                    </select>

                </div>


                <!-- Position -->

                <div id="positionField">

                    <label class="block mb-2 font-medium">
                        Position
                    </label>

                    <select
                        name="position"
                        id="position"
                        class="w-full border rounded-xl px-4 py-3">

                        <option value="">
                            Select Position
                        </option>

                        <option value="First">
                            First
                        </option>

                        <option value="Second">
                            Second
                        </option>

                        <option value="Third">
                            Third
                        </option>

                    </select>

                </div>


                <!-- Assigned Points -->

                <div
                    id="assignedPointsField"
                    class="hidden">

                    <label class="block mb-2 font-medium">
                        Assigned Points
                    </label>

                    <input
                        type="number"
                        name="assigned_points"
                        id="assignedPoints"
                        min="0"
                        step="0.5"
                        placeholder="Enter assigned points"
                        class="w-full border rounded-xl px-4 py-3">

                    <p class="text-xs text-slate-500 mt-1">
                        Used only for Others.
                    </p>

                </div>


                <!-- Title -->

                <div>

                    <label class="block mb-2 font-medium">
                        Achievement Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        required
                        placeholder="Achievement title"
                        class="w-full border rounded-xl px-4 py-3">

                </div>


                <!-- Organization -->

                <div>

                    <label class="block mb-2 font-medium">
                        Issuing Organization
                    </label>

                    <input
                        type="text"
                        name="issuing_organization"
                        placeholder="Organization / Institution"
                        class="w-full border rounded-xl px-4 py-3">

                </div>


                <!-- Date -->

                <div>

                    <label class="block mb-2 font-medium">
                        Achievement Date
                    </label>

                    <input
                        type="date"
                        name="achievement_date"
                        class="w-full border rounded-xl px-4 py-3">

                </div>


                <!-- Certificate Number -->

                <div>

                    <label class="block mb-2 font-medium">
                        Certificate Number
                    </label>

                    <input
                        type="text"
                        name="certificate_number"
                        placeholder="Certificate number"
                        class="w-full border rounded-xl px-4 py-3">

                </div>


                <!-- Verification -->

                <div>

                    <label class="block mb-2 font-medium">
                        Verification Value
                    </label>

                    <input
                        type="text"
                        name="verification_value"
                        placeholder="Verification reference"
                        class="w-full border rounded-xl px-4 py-3">

                </div>


                <!-- Certificate Upload -->

                <div>

                    <label class="block mb-2 font-medium">
                        Certificate
                    </label>

                    <input
                        type="file"
                        name="certificate_file"
                        accept=".pdf,.jpg,.jpeg,.png"
                        class="w-full border rounded-xl px-4 py-3">

                    <p class="text-xs text-slate-500 mt-1">
                        PDF, JPG, JPEG or PNG
                    </p>

                </div>

            </div>


            <!-- Description -->

            <div class="mt-6">

                <label class="block mb-2 font-medium">
                    Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                    placeholder="Additional details"
                    class="w-full border rounded-xl px-4 py-3"></textarea>

            </div>


            <div class="flex justify-end gap-4 mt-8">

                <a
                    href="{{ url_for('achievement.achievement_list') }}"
                    class="px-6 py-3 rounded-xl border">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl">

                    Submit Achievement

                </button>

            </div>

        </form>

    </div>

</div>


<script>

const category =
    document.getElementById(
        "achievementCategory"
    );

const positionField =
    document.getElementById(
        "positionField"
    );

const assignedPointsField =
    document.getElementById(
        "assignedPointsField"
    );

const position =
    document.getElementById(
        "position"
    );

const assignedPoints =
    document.getElementById(
        "assignedPoints"
    );


function updateAchievementFields() {

    if (category.value === "Others") {

        positionField.classList.add(
            "hidden"
        );

        assignedPointsField.classList.remove(
            "hidden"
        );

        position.required = false;
        assignedPoints.required = true;

    } else {

        positionField.classList.remove(
            "hidden"
        );

        assignedPointsField.classList.add(
            "hidden"
        );

        position.required = true;
        assignedPoints.required = false;

        assignedPoints.value = "";

    }
}


category.addEventListener(
    "change",
    updateAchievementFields
);

updateAchievementFields();

</script>

{% endblock %}
